<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">

</head>
<body>


<div class="container text-center mt-5">

    <h1 class="display-1 fw-bold text-danger" th:text="${errorCode}"></h1>

    <p class="lead text-muted" th:text="${errorTitle}">
        Oops! Something went wrong while processing your request.
    </p>

    <p class="text-secondary" th:text="${errorMessage}">

    </p>

    <div class="my-4">
        <span style="font-size: 5rem;">⚠️</span>
    </div>

    <p class="text-secondary">
        Please try again later. If the problem persists, contact the administrator.
    </p>
    <div class="mt-4">
        <a th:href="@{/dashboard}" class="btn btn-primary me-2">
            Go Back
        </a>

        <a href="javascript:location.reload()" class="btn btn-outline-secondary">
            Try Again
        </a>
    </div>

</div>

</body>
</html>
