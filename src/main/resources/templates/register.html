<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FinanceTracker</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <form th:action="@{/register}" th:object="${userRegisterRequest}" th:method="post">

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" th:field="*{username}">
                <p class="alert-warning" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>

            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="firstName" placeholder="First Name" th:field="*{firstName}">
                <p class="alert-warning" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></p>
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="lastName" placeholder="Last Name" th:field="*{lastName}">
                <p class="alert-warning" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></p>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter email" th:field="*{email}">
                <p class="alert-warning" th:if="${#fields.hasErrors('email')}" th:error="*{email}"></p>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" th:field="*{password}">
                <p class="alert-warning" th:if="${#fields.hasErrors('password')}" th:error="*{password}"></p>
            </div>

            <button type="submit" class="auth-btn">
                Register
            </button>

        </form>

        <p class="bottom-text">
            Already have an account?
            <a href="/login">Login</a>
        </p>

    </div>

</div>

</body>
</html>
