<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FinanceTracker</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back! <br> 📊 Finance Tracker</h1>

        <form th:action="@{/login}" th:object="${userLoginRequest}" th:method="post">

            <div th:if="${error}" class="error">
                <p th:text="${error}"></p>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter username" th:field="*{username}">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter password" th:field="*{password}">
            </div>

            <button type="submit" class="auth-btn">
                Login
            </button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="/register">Register</a>
        </p>

    </div>

</div>

</body>
</html>
