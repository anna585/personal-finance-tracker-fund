<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Users | FinanceTracker</title>
    <link rel="stylesheet" th:href="@{/css/users.css}">
</head>
<body>

<header>
    <nav class="navbar">
        <h2>FinanceTracker Admin</h2>

        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/admin/users">Users</a>
            <a href="/admin/reports">Reports</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>
</header>

<main>

    <section class="page-header">
        <h1>Users Management</h1>
    </section>

    <section class="users-table">

        <table>

            <thead>
            <tr>
                <th>Username</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Registered On</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="user : ${users}">
                <td th:text="${user.username}"></td>
                <td th:text="${user.firstName} + ' ' + ${user.lastName}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${#temporals.format(user.createdOn, 'yyyy-MM-dd')}"></td>
                <td th:text="${user.userRole}"></td>

                <td>
                    <form th:action="@{/users/{id}/delete(id=${user.id})}"
                          method="post">
                    <button type="submit" class="delete-btn">
                        Delete
                    </button>
                    </form>
                </td>
            </tr>

            </tbody>

        </table>

    </section>

</main>

</body>
</html>
