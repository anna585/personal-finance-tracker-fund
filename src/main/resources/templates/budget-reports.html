<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Financial Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="/css/budget-reports.css">
</head>
<body class="bg-light">

<header>
    <nav class="navbar">
        <h2 class="logo">FinanceTracker</h2>

        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/transactions">Transactions</a>
            <a href="/budget">Budget</a>
            <a href="/savings">Savings</a>
            <a href="/report-history">Report History</a>
            <div sec:authorize="hasRole('ROLE_ADMIN')">
                <a href="/admin/users">Users</a>
                <span> | </span>
                <a href="/admin/statistics">Statistics</a>
            </div>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </nav>
</header>

<div class="container py-5">

    <h2 class="text-center mb-4">
        📊 Financial Reports
    </h2>

    <div class="card shadow-lg border-0">

        <div class="card-body">

            <form th:action="@{/budget-reports}" th:object="${request}" th:method="post">

                <div class="row">

                    <div class="col-md-5">
                        <label class="form-label">
                            Start Date
                        </label>

                        <input
                                type="date"
                                class="form-control"
                                th:field="*{start}">
                        <p class="alert-warning" th:if="${#fields.hasErrors('start')}" th:errors="*{start}">
                    </div>

                    <div class="col-md-5">

                        <label class="form-label">
                            End Date
                        </label>

                        <input
                                type="date"
                                class="form-control"
                                th:field="*{end}">
                        <p class="alert-warning" th:if="${#fields.hasErrors('end')}" th:errors="*{end}">
                    </div>

                    <div class="col-md-2 d-flex align-items-end">

                        <button class="btn btn-primary w-100">
                            Generate
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <div class="card shadow-lg mt-5 border-0"
         th:if="${report != null}">

        <div class="card-header bg-primary text-white">

            Report Summary

        </div>

        <div class="card-body" >

            <div class="row">

                <div class="col-md-6">

                    <div class="report-item">
                        <span>Total Income</span>
                        <strong th:text="${@currencyFormatter.format(report.income)}"></strong>
                    </div>

                    <div class="report-item">
                        <span>Total Expenses</span>
                        <strong th:text="${@currencyFormatter.format(report.expenses)}"></strong>
                    </div>

                    <div class="report-item">
                        <span>Current Balance</span>
                        <strong th:text="${@currencyFormatter.format(report.balance)}"></strong>
                    </div>

                </div>

                <div class="col-md-6">

                    <div class="report-item">
                        <span>Largest Expense Category</span>
                        <strong th:text="${report.largestExpense}"></strong>
                    </div>

                    <div class="report-item">
                        <span>Saving Rate</span>
                        <strong th:text="${report.savingRate + ' %'}"></strong>
                    </div>

                    <div class="report-item">
                        <span>Generated At</span>
                        <strong th:text="${#temporals.format(report.generatedAt, 'dd/MM/yyyy')}"></strong>
                    </div>

                </div>

            </div>

        </div>

    </div>


    </div>

</div>

</body>
</html>
