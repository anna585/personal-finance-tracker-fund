<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transactions</title>
    <link rel="stylesheet" href="/css/transactions.css">

</head>
<body>

<header>
    <nav class="navbar">
        <h2>FinanceTracker</h2>

        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/transactions">Transactions</a>
            <a href="/budget">Budget</a>
            <a href="/profile">Profile</a>
        </div>
    </nav>
</header>

<main>

    <section class="page-header">
        <h1>Transactions</h1>
        <a href="/transactions/add" class="add-btn">
            + Add Transaction
        </a>
    </section>

    <section class="transactions-table">

        <table>

            <thead>
            <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr>
                <td>05/06/2026</td>
                <td>Salary</td>
                <td>Income</td>
                <td>Income</td>
                <td class="income">+ ₺8500</td>

                <td>
                    <a href="#">Edit</a>
                    <a href="#">Delete</a>
                </td>
            </tr>

            <tr>
                <td>04/06/2026</td>
                <td>Rent</td>
                <td>Housing</td>
                <td>Expense</td>
                <td class="expense">- ₺2000</td>

                <td>
                    <a href="#">Edit</a>
                    <a href="#">Delete</a>
                </td>
            </tr>

            </tbody>

        </table>

    </section>

</main>

</body>
</html>
