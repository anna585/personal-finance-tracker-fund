<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Transactions | FinanceTracker</title>
    <link rel="stylesheet" href="/css/transactions.css">

</head>
<body>

<header>
    <nav class="navbar">
        <h2 class="logo">FinanceTracker</h2>

        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/transactions">Transactions</a>
            <a href="/budget">Budget</a>
            <a href="/savings">Savings</a>
            <a href="/report-history">Report History</a>
            <div sec:authorize="hasRole('ROLE_ADMIN')">
                <a href="/admin/users">Users</a>
                <span> | </span>
                <a href="/admin/statistics">Statistics</a>
            </div>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </nav>
</header>

<main>

    <section class="page-header">
        <h1>Transactions</h1>
        <a href="/transactions/add" class="add-btn">
            + Add Transaction
        </a>
    </section>

    <section class="transactions-table">

        <div class="success-message" th:if="${param.success}">
            <p>Transaction saved successfully!</p>
        </div>

        <div th:if="${error}" class="error">
            <p th:text="${error}"></p>
        </div>

        <table>

            <thead>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="transaction : ${transactions}">
                <td th:text="${#temporals.format(transaction.createdAt, 'dd/MM/yyyy hh:mm')}"></td>
                <td th:text="${transaction.categoryType}"></td>
                <td th:text="${transaction.type}"></td>
                <td>
                    <p th:if="${transaction.type.name() == 'INCOME'}" class="income" th:text="'+ ' + ${@currencyFormatter.format(transaction.amount)}"></p>
                    <p th:if="${transaction.type.name() == 'EXPENSE'}" class="expense" th:text="'- ' + ${@currencyFormatter.format(transaction.amount)}"></p>
                </td>

                <td>
                    <form th:action="@{/transactions/{id}/delete(id=${transaction.id})}"
                             method="post"
                             onsubmit="return confirm('Are you sure you want to delete this transaction?')">
                    <button type="submit" class="delete-btn">
                        Delete
                    </button>

                        <a th:href="@{/transactions/{id}/edit(id=${transaction.id})}"
                            class="edit-btn">
                            Edit
                        </a>
                    </form>

                </td>
            </tr>

            </tbody>

        </table>

    </section>

</main>

</body>
</html>
