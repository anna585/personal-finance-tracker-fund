<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Transactions | FinanceTracker</title>
    <link rel="stylesheet" href="/css/transactions.css">

</head>
<body>

<header>
    <nav class="navbar">
        <h2>FinanceTracker</h2>

        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/budget">Budget</a>
            <a href="/savings">Savings</a>
            <a href="/transactions">Transactions</a>
            <a href="/admin/users">Users</a>
            <a href="/admin/reports">Reports</a>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </nav>
</header>

<main>

    <section class="page-header">
        <h1>Transactions</h1>
        <a href="/transactions/add" class="add-btn">
            + Add Transaction
        </a>
    </section>

    <section class="transactions-table">

        <table>

            <thead>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="transaction : ${user.transactions}">
                <td th:text="${#temporals.format(transaction.date, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${transaction.categoryType}"></td>
                <td th:text="${transaction.type}"></td>
                <td>
                    <p th:if="${transaction.type.name() == 'INCOME'}" class="income" th:text="'+ ' + ${transaction.amount} + ' €'"></p>
                    <p th:if="${transaction.type.name() == 'EXPENSE'}" class="expense" th:text="'- ' + ${transaction.amount} + ' €'"></p>
                </td>

                <td>
                    <form th:action="@{/transactions/{id}/delete(id=${transaction.id})}"
                             method="post"
                             onsubmit="return confirm('Are you sure you want to delete this transaction?')">
                    <button type="submit" class="delete-btn">
                        Delete
                    </button>
                </form></td>


            </tr>


            </tbody>

        </table>

    </section>

</main>

</body>
</html>
