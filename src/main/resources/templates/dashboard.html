<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | FinanceTracker</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h2 class="logo">FinanceTracker</h2>

        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/budget">Budget</a>
            <a href="/savings">Savings</a>
            <a href="/transactions">Transactions</a>
            <a href="/admin/users">Users</a>
            <a href="/admin/reports">Reports</a>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </nav>
</header>

<main>

    <section class="welcome-section">
        <h1>Welcome back,</h1>
        <h1 th:text="${user.firstName}"></h1>
        <p>Here's an overview of your finances.</p>
    </section>

    <section class="summary-cards">

        <div class="card">
            <h3>Current Balance</h3>
            <span class="amount" th:text="'€ ' + ${#numbers.formatDecimal(currentBalance, 1, 2)}" ></span>
        </div>

        <div class="card income-card">
            <h3>Income</h3>
            <span class="amount" th:text="'€ ' + ${#numbers.formatDecimal(income, 1, 2)}"></span>
        </div>

        <div class="card expense-card">
            <h3>Expenses</h3>
            <span class="amount" th:text="'€ ' + ${#numbers.formatDecimal(expenses, 1, 2)}"></span>
        </div>

    </section>

    <section class="actions">

        <a href="/transactions/add/income" class="action-btn income-btn">
            + Add Income
        </a>

        <a href="/transactions/add/expense" class="action-btn expense-btn">
            - Add Expense
        </a>

    </section>

    <section class="transactions">

        <h2>Recent Transactions</h2>

        <table>

            <thead>
            <tr>
                <th>Date</th>
                <th>Category</th>
                <th>Type</th>
                <th>Amount</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="transaction : ${user.transactions}">
                <td th:text="${#temporals.format(transaction.date, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${transaction.categoryType}"></td>
                <td th:text="${transaction.type}"></td>
                <td>
                    <p th:if="${transaction.type.name() == 'INCOME'}" class="income" th:text="'+ ' + ${transaction.amount} + ' €'"></p>
                    <p th:if="${transaction.type.name() == 'EXPENSE'}" class="expense" th:text="'- ' + ${transaction.amount} + ' €'"></p>
                </td>
            </tr>

            </tbody>

        </table>

    </section>

</main>

</body>
</html>
