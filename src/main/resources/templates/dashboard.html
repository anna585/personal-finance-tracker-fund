<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | FinanceTracker</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h2 class="logo">FinanceTracker</h2>

        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/transactions">Transactions</a>
            <a href="/budget">Budget</a>
            <a href="/savings">Savings</a>
            <a href="/report-history">Report History</a>
            <div sec:authorize="hasRole('ROLE_ADMIN')">
                <a href="/admin/users">Users</a>
                <span> | </span>
                <a href="/admin/statistics">Statistics</a>
            </div>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </nav>
</header>

<main>

    <section class="welcome-section">
        <h1>Welcome back,</h1>
        <h1 th:text="${user.firstName}"></h1>
        <p>Current Month Summary</p>

    </section>

    <section class="summary-cards">
        <div class="card">
            <h3>Current Balance</h3>
            <span class="amount" th:text="'€ ' + ${#numbers.formatDecimal(summaryResponses.monthlyBalance, 1, 2)}" ></span>
        </div>

        <div class="card income-card">
            <h3>Income</h3>
            <span class="amount" th:text="'€ ' + ${#numbers.formatDecimal(summaryResponses.monthlyIncome, 1, 2)}"></span>
        </div>

        <div class="card expense-card">
            <h3>Expenses</h3>
            <span class="amount" th:text="'€ ' + ${#numbers.formatDecimal(summaryResponses.monthlyExpense, 1, 2)}"></span>
        </div>

        <div class="card saving-card">
            <h3>Saving Rate</h3>
            <span class="amount" th:text="${summaryResponses.monthlySavingRade} + ' %'"></span>
        </div>

    </section>

    <section class="actions">

        <a href="/budget-reports" class="action-btn new-report-btn">
            Generate New Report
        </a>

        <a href="/budget-reports" class="action-btn report-history-btn">
            View Report History
        </a>

    </section>


</main>

</body>
</html>
