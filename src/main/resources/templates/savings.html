<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Saving Goals | FinanceTracker</title>
    <link rel="stylesheet" href="/css/savings.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h2>FinanceTracker</h2>

        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/transactions">Transactions</a>
            <a href="/budget">Budget</a>
            <a href="/savings">Savings</a>
        </div>
    </nav>
</header>

<main>

    <section class="page-header">
        <h1>Saving Goals</h1>

        <a href="/savings/add" class="btn-add">
            + Add Goal
        </a>
    </section>

    <section class="goals-container" >

        <div class="goal-card"
             th:each="goal : ${user.saving}">

            <h3 th:text="*{goal.goalName}">
                Vacation Fund
            </h3>

            <div class="goal-info">
                <span>Target:</span>
                <strong th:text="*{goal.targetAmount}">
                    5000
                </strong>
            </div>

            <div class="goal-info">
                <span>Saved:</span>
                <strong th:text="*{goal.currentAmount}">
                    1200
                </strong>
            </div>

<!--            <div class="progress-container">-->
<!--                <div class="progress-bar"-->
<!--                     th:style="'width:' + ${goal.progress} + '%'">-->
<!--                </div>-->
<!--            </div>-->

<!--            <p class="progress-text">-->
<!--                <span th:text="${goal.progress}">-->
<!--                    24-->
<!--                </span>%-->
<!--                completed-->
<!--            </p>-->

            <div class="goal-actions">

                <a th:href="@{/savings/{id}/edit(id=${goal.id})}"
                   class="btn-edit">
                    Edit
                </a>

                <a th:href="@{/savings/{id}/delete(id=${goal.id})}"
                   class="btn-delete">
                    Delete
                </a>

            </div>

        </div>
    </section>

</main>

</body>
</html>
