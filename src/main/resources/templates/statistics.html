<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reports | FinanceTracker</title>
    <link rel="stylesheet" th:href="@{/css/statistics.css}">
</head>
<body>

<header>
    <nav class="navbar">
        <h2>FinanceTracker Admin</h2>

        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/transactions">Transactions</a>
            <a href="/budget">Budget</a>
            <a href="/savings">Savings</a>
            <a href="/report-history">Report History</a>
            <a href="/profile">Profile</a>
            <a href="/admin/users">Users</a>
            <a href="/admin/statistics">Statistics</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>
</header>

<main>

    <section class="page-header">
        <h1>System Reports</h1>
    </section>

    <section class="report-cards">

        <div class="card">
            <h3>Total Users</h3>
            <span th:text="${statistics.getTotalUsers()}"></span>
        </div>

        <div class="card">
            <h3>Total Transactions</h3>
            <span th:text="${statistics.getTotalTransactions()}"></span>
        </div>

        <div class="card">
            <h3>Total Budgets</h3>
            <span th:text="${statistics.getTotalBudget()}"></span>
        </div>

        <div class="card">
            <h3>Saving Goals</h3>
            <span th:text="${statistics.getTotalSavings()}"></span>
        </div>

    </section>

    <section class="report-table">

        <h2>Latest Registered Users</h2>

        <table>

            <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Created On</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="user : ${users}">
                <td th:text="${user.getUsername()}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${#temporals.format(user.createdOn, 'yyyy-MM-dd')}"></td>
            </tr>

            </tbody>

        </table>

    </section>

</main>

</body>
</html>
