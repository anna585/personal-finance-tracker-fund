<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Budget</title>
    <!-- <link rel="stylesheet" th:href="@{/css/budget.css}"> -->
    <link rel="stylesheet" href="/css/budget.css">
</head>
<body>

<header>
    <nav class="navbar">
        <h2>FinanceTracker</h2>

        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/transactions">Transactions</a>
            <a href="/budget">Budget</a>
            <a href="/profile">Profile</a>
        </div>
    </nav>
</header>

<main>

    <section class="budget-header">
        <h1>Monthly Budget</h1>
    </section>

    <section class="budget-cards">

        <div class="budget-card">
            <h3>Total Budget</h3>
            <span>₺10,000</span>
        </div>

        <div class="budget-card spent">
            <h3>Spent</h3>
            <span>₺4,250</span>
        </div>

        <div class="budget-card remaining">
            <h3>Remaining</h3>
            <span>₺5,750</span>
        </div>

    </section>

    <section class="progress-section">

        <h2>Budget Usage</h2>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <p>42% used</p>

    </section>

    <section class="update-budget">

        <h2>Update Budget</h2>

        <form>

            <input
                    type="number"
                    placeholder="Enter new budget amount">

            <button type="submit">
                Save Budget
            </button>

        </form>

    </section>

</main>

</body>
</html>
